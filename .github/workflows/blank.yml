name: Build Mod JAR

# Simpan di: .github/workflows/build.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Kalau project masih berupa file .rar (part1 + part2), ekstrak dulu
      - name: Ekstrak RAR (jika ada)
        run: |
          FIRST=$(find . -maxdepth 2 -iname '*part1.rar' -not -path './.git/*' | head -n 1)
          if [ -z "$FIRST" ]; then
            FIRST=$(find . -maxdepth 2 -iname '*.rar' -not -path './.git/*' | sort | head -n 1)
          fi
          if [ -z "$FIRST" ]; then
            echo "Tidak ada file .rar, lanjut pakai file di repo."
            exit 0
          fi
          echo "Mengekstrak: $FIRST"
          ls -la "$(dirname "$FIRST")" | grep -i rar || true
          mkdir -p _src
          sudo apt-get update -qq
          if sudo apt-get install -y -qq unrar; then
            unrar x -o+ -y "$FIRST" _src/
          else
            sudo apt-get install -y -qq 7zip
            7zz x -y -o_src "$FIRST"
          fi
          echo "Isi hasil ekstrak:"
          find _src -maxdepth 2 | head -40

      # Cari otomatis lokasi build.gradle (prioritas hasil ekstrak, lalu seluruh repo)
      - name: Cari folder project
        run: |
          BUILD_FILE=""
          if [ -d _src ]; then
            BUILD_FILE=$(find _src -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          fi
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle tidak ditemukan. Cek apakah RAR part1 & part2 lengkap dan namanya benar (xxx.part1.rar, xxx.part2.rar)."
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          if [ -f "$DIR/gradlew" ]; then
            echo "HAS_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WRAPPER=false" >> "$GITHUB_ENV"
          fi
          echo "Project ada di: $DIR"

      # Perbaiki 7 error kompilasi (GeckoLib 4.4.9 + getMaxHealth final di 1.20.1)
      - name: Terapkan patch kode
        run: |
          python3 - << 'PYEOF'
          import os, sys

          proj = os.environ["PROJECT_DIR"]
          base = os.path.join(proj, "src/main/java/com/sirenhead")

          # ---------- 1) SirenHeadEntity: getMaxHealth() bersifat final di 1.20.1 ----------
          p = os.path.join(base, "entity/SirenHeadEntity.java")
          s = open(p, encoding="utf-8").read()

          def rep(s, old, new):
              if s.count(old) != 1:
                  print("SKIP (sudah diperbaiki / tidak cocok):", old.strip()[:70])
                  return s
              return s.replace(old, new)

          if "MAX_HEALTH dibatasi" in s:
              print("SKIP SirenHeadEntity: sudah dipatch")
          else:
            s = rep(s,
              "    @Override public float getMaxHealth() { return variant == null ? super.getMaxHealth() : variant.health; }\n",
              "")
            s = rep(s,
              "        this.setHealth(this.getMaxHealth());\n",
              "        // MAX_HEALTH dibatasi 1024 oleh vanilla -> sisanya diskalakan lewat damage (lihat actuallyHurt)\n"
              "        this.getAttribute(Attributes.MAX_HEALTH).setBaseValue(Math.min(v.health, 1024.0F));\n"
              "        this.setHealth(this.getMaxHealth());\n")
            s = rep(s,
              "        super.actuallyHurt(src, amount);\n",
              "        if (variant != null && variant.health > getMaxHealth()) amount *= getMaxHealth() / variant.health;\n"
              "        super.actuallyHurt(src, amount);\n")
          open(p, "w", encoding="utf-8").write(s)

          # ---------- 2) PlotArmorItem: API GeckoLib 4.4.9 (1.20.1) pakai IClientItemExtensions ----------
          p = os.path.join(base, "item/PlotArmorItem.java")
          s = open(p, encoding="utf-8").read()
          s = rep(s, "import software.bernie.geckolib.animatable.client.RenderProvider;\n",
                     "import net.minecraftforge.client.extensions.common.IClientItemExtensions;\n")
          s = rep(s, "    private final Supplier<Object> renderProvider = GeoItem.makeRenderer(this);\n", "")
          new_block = '''    @Override public void initializeClient(Consumer<IClientItemExtensions> consumer) {
                  consumer.accept(new IClientItemExtensions() {
                      private PlotArmorRenderer renderer;
                      @Override public HumanoidModel<?> getHumanoidArmorModel(LivingEntity e, ItemStack s, EquipmentSlot slot, HumanoidModel<?> original) {
                          if (renderer == null) renderer = new PlotArmorRenderer();
                          renderer.prepForRender(e, s, slot, original);
                          return renderer;
                      }
                  });
              }
          '''
          if "public void createRenderer(" in s:
              start = s.index("    @Override public void createRenderer(")
              end = s.index("    @Override public void registerControllers")
              s = s[:start] + new_block + s[end:]
          else:
              print("SKIP PlotArmorItem: createRenderer tidak ada")
          open(p, "w", encoding="utf-8").write(s)
          print("Patch selesai")
          PYEOF

      - name: Setup Gradle (cache)
        if: env.HAS_WRAPPER == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle 8.1.1 (tanpa wrapper)
        if: env.HAS_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build (pakai gradlew)
        if: env.HAS_WRAPPER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Build (pakai gradle)
        if: env.HAS_WRAPPER == 'false'
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sirenhead-forge-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
            
