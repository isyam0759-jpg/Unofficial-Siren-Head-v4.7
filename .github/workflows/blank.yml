name: Build Mod JAR

# Simpan di: .github/workflows/build.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cari otomatis lokasi build.gradle (root repo ATAU di subfolder)
      - name: Cari folder project
        run: |
          BUILD_FILE=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle tidak ditemukan di repo. Pastikan semua file project sudah di-upload."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          if [ -f "$DIR/gradlew" ]; then
            echo "HAS_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WRAPPER=false" >> "$GITHUB_ENV"
          fi
          echo "Project ada di: $DIR"

      # Kalau gradlew ada -> pakai wrapper
      - name: Setup Gradle (cache)
        if: env.HAS_WRAPPER == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Kalau gradlew TIDAK ada -> pakai Gradle yang diinstall (cocok untuk Forge 1.20.1)
      - name: Setup Gradle 8.1.1 (tanpa wrapper)
        if: env.HAS_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build (pakai gradlew)
        if: env.HAS_WRAPPER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Build (pakai gradle)
        if: env.HAS_WRAPPER == 'false'
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sirenhead-forge-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
            
