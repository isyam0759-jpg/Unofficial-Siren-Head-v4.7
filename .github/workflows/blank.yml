name: Build Mod JAR

# Taruh file ini di: .github/workflows/build.yml
# (di dalam repo, sejajar dengan folder src/ dan file build.gradle)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: write      # dibutuhkan hanya untuk step Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sirenhead-forge-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

      # Opsional: otomatis bikin Release kalau kamu push tag, mis. v1.0.0
      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            
