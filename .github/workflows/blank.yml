name: Build Mod JAR

# Simpan di: .github/workflows/build.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Kalau project masih berupa file .rar (part1 + part2), ekstrak dulu
      - name: Ekstrak RAR (jika ada)
        run: |
          FIRST=$(find . -maxdepth 2 -iname '*part1.rar' -not -path './.git/*' | head -n 1)
          if [ -z "$FIRST" ]; then
            FIRST=$(find . -maxdepth 2 -iname '*.rar' -not -path './.git/*' | sort | head -n 1)
          fi
          if [ -z "$FIRST" ]; then
            echo "Tidak ada file .rar, lanjut pakai file di repo."
            exit 0
          fi
          echo "Mengekstrak: $FIRST"
          ls -la "$(dirname "$FIRST")" | grep -i rar || true
          mkdir -p _src
          sudo apt-get update -qq
          if sudo apt-get install -y -qq unrar; then
            unrar x -o+ -y "$FIRST" _src/
          else
            sudo apt-get install -y -qq 7zip
            7zz x -y -o_src "$FIRST"
          fi
          echo "Isi hasil ekstrak:"
          find _src -maxdepth 2 | head -40

      # Cari otomatis lokasi build.gradle (prioritas hasil ekstrak, lalu seluruh repo)
      - name: Cari folder project
        run: |
          BUILD_FILE=""
          if [ -d _src ]; then
            BUILD_FILE=$(find _src -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          fi
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle tidak ditemukan. Cek apakah RAR part1 & part2 lengkap dan namanya benar (xxx.part1.rar, xxx.part2.rar)."
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          if [ -f "$DIR/gradlew" ]; then
            echo "HAS_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WRAPPER=false" >> "$GITHUB_ENV"
          fi
          echo "Project ada di: $DIR"

      - name: Setup Gradle (cache)
        if: env.HAS_WRAPPER == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle 8.1.1 (tanpa wrapper)
        if: env.HAS_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build (pakai gradlew)
        if: env.HAS_WRAPPER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Build (pakai gradle)
        if: env.HAS_WRAPPER == 'false'
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sirenhead-forge-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-javadoc.jar
            
